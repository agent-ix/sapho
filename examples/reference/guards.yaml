inputs:
  enabled:
    kind: boolean
  flag:
    kind: boolean
nodes:
- id: conditional
  operation:
    kind: not
  inputs:
    value:
      kind: input
      name: flag
  guard:
    kind: input
    name: enabled
- id: fallback
  operation:
    kind: coalesce
  inputs:
    value:
      kind: node
      node: conditional
      port: result
    default:
      kind: literal
      value:
        id: constant
        value:
          kind: boolean
          value: true
      value_type:
        kind: boolean
- id: disabled
  operation: {kind: not}
  inputs:
    value: {kind: input, name: enabled}
- id: fallback_present
  guard: {kind: node, node: disabled, port: result}
  operation: {kind: not}
  inputs:
    value:
      kind: literal
      value: {id: "false", value: {kind: boolean, value: false}}
      value_type: {kind: boolean}
- id: merged
  operation: {kind: merge_present}
  inputs:
    conditional: {kind: node, node: conditional, port: result}
    fallback: {kind: node, node: fallback_present, port: result}
outputs:
  optional:
    kind: node
    node: conditional
    port: result
  decision:
    kind: node
    node: fallback
    port: result
  merged: {kind: node, node: merged, port: result}
subgraphs: {}
