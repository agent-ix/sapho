inputs:
  items:
    kind: list
    item:
      kind: record
      fields:
        text:
          kind: text
nodes:
- id: mask
  operation:
    kind: map
    graph: judge_item
  inputs:
    items:
      kind: input
      name: items
- id: selected
  operation:
    kind: filter
  inputs:
    items:
      kind: input
      name: items
    mask:
      kind: node
      node: mask
      port: result
outputs:
  selected:
    kind: node
    node: selected
    port: result
subgraphs:
  judge_item:
    inputs:
      item:
        kind: record
        fields:
          text:
            kind: text
    nodes:
    - id: q
      operation:
        kind: questions
        questions:
        - id: observable
          question:
            kind: boolean
            instructions: Does the text name an observable action?
            'yes': Observable action
            'no': No observable action
      inputs: {}
    - id: ask
      operation:
        kind: ask
        backend: judge
      inputs:
        state:
          kind: input
          name: item
        questions:
          kind: node
          node: q
          port: result
    - id: p
      operation:
        kind: probability
        question: observable
        labels:
        - 'true'
      inputs:
        answers:
          kind: node
          node: ask
          port: answers
    - id: keep
      operation:
        kind: compare
        comparator: greater_equal
      inputs:
        a:
          kind: node
          node: p
          port: result
        b:
          kind: literal
          value:
            id: constant
            value:
              kind: probability
              value: 0.7
          value_type:
            kind: probability
    outputs:
      result:
        kind: node
        node: keep
        port: result
