[workspace]
members = ["crates/sapho-core", "crates/sapho-graph", "crates/sapho-runtime", "crates/sapho-jev", "crates/sapho-clm", "crates/sapho-systemone", "crates/sapho-recording", "crates/sapho-evidence", "crates/sapho-select", "crates/sapho-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/sapho"
authors = ["Agent IX <agent@agent-ix.dev>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["fs", "process"] }
cap-std = "4"
cap-fs-ext = "4"
globset = "0.4"
sha2 = "0.10"
serde_stacker = "0.1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sapho-core = { path = "crates/sapho-core", version = "0.1.0" }
sapho-graph = { path = "crates/sapho-graph", version = "0.1.0" }
sapho-runtime = { path = "crates/sapho-runtime", version = "0.1.0" }
sapho-recording = { path = "crates/sapho-recording", version = "0.1.0" }
sapho-select = { path = "crates/sapho-select", version = "0.1.0" }
sapho-evidence = { path = "crates/sapho-evidence", version = "0.1.0" }
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", rev = "cc69a934f887966f955440bff8c356e3da449bee", features = ["secrets"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sapho-systemone = { path = "crates/sapho-systemone", version = "0.1.0" }
sapho-clm = { path = "crates/sapho-clm", version = "0.1.0" }
sapho-jev = { path = "crates/sapho-jev", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[package]
name = "sapho"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
description = "Embedding facade for the Sapho configurable judgment graph engine."

[lints]
workspace = true

[features]
default = []
jev = ["dep:sapho-jev"]
clm = ["dep:sapho-clm"]

[dependencies]
sapho-core.workspace = true
sapho-graph.workspace = true
sapho-runtime.workspace = true
sapho-recording.workspace = true
sapho-jev = { workspace = true, optional = true }
sapho-clm = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
async-trait.workspace = true
serde_json.workspace = true
tempfile = "3"
