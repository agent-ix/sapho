[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2
db-path = "target/advisory-dbs"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/agent-ix/ix-cli-kit"]

# Sapho owns this license; dependencies retain the permissive allowlist above.
[[licenses.exceptions]]
name = "sapho"
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "sapho-core"
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "sapho-graph"
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "sapho-runtime"
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "sapho-jev"
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "sapho-recording"
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "borrow-or-share"
allow = ["MIT-0"]
[[licenses.exceptions]]
name = "sapho-ollama"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "sapho-evidence"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "sapho-select"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "sapho-cli"
allow = ["AGPL-3.0-or-later"]

# Build-only stacker/psm archive writer: its authoritative LICENSE.txt is Apache
# 2.0 with LLVM's redistribution exceptions. This narrowly permits the examined
# release; it does not broaden the dependency allowlist or exempt advisories.
[[licenses.exceptions]]
name = "ar_archive_writer"
version = "=0.5.3"
allow = ["Apache-2.0 WITH LLVM-exception"]
# Windows capability support uses the same examined Apache/LLVM expression.
[[licenses.exceptions]]
name = "winx"
version = "=0.36.4"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
name = "sapho-clm"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "sapho-claude"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "ix-cli-kit"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "sapho-systemone"
allow = ["AGPL-3.0-or-later"]
